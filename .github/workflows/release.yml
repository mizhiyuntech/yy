name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  backend:
    name: Build backend bundle (Linux binary + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Build admin dashboard
        working-directory: admin
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Build Linux binaries and bundle static assets
        working-directory: server
        run: |
          # The admin static assets live next to the binary in ./web.
          rm -rf web && cp -r ../admin/dist web
          for arch in amd64 arm64; do
            out="yy-im-linux-${arch}"
            mkdir -p "dist/${out}"
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -ldflags "-s -w" -o "dist/${out}/yy-im" .
            cp -r web "dist/${out}/web"
            (cd dist && tar -czf "${out}.tar.gz" "${out}")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: backend-bundles
          path: server/dist/*.tar.gz

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: server/dist/*.tar.gz

  mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Assemble release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        working-directory: mobile
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/yy-im.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yy-im-android
          path: mobile/out/yy-im.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/out/yy-im.apk
