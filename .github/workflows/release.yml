name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  backend:
    name: Build backend bundle (Linux binary + web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Build admin dashboard
        working-directory: admin
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: server/go.sum

      - name: Build Linux binaries and package web assets
        working-directory: server
        run: |
          mkdir -p dist
          # Standalone binaries, one per architecture (no nested archives).
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -ldflags "-s -w" -o "dist/yy-im-linux-${arch}" .
          done
          # The admin static assets that live next to the binary in ./web,
          # packaged once and shared across architectures.
          rm -rf web && cp -r ../admin/dist web
          zip -r dist/web.zip web
          cp config.example.json dist/config.example.json

      - uses: actions/upload-artifact@v4
        with:
          name: backend-release
          path: |
            server/dist/yy-im-linux-amd64
            server/dist/yy-im-linux-arm64
            server/dist/web.zip
            server/dist/config.example.json

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            server/dist/yy-im-linux-amd64
            server/dist/yy-im-linux-arm64
            server/dist/web.zip
            server/dist/config.example.json

  mobile:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Assemble release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        working-directory: mobile
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/yy-im.apk

      - uses: actions/upload-artifact@v4
        with:
          name: yy-im-android
          path: mobile/out/yy-im.apk

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/out/yy-im.apk
